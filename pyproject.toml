[project]
name = "emet-echo"
version = "0.1.0"
description = "Conservative news aggregator with AI summaries, EO tracker, and newsletters"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "feedparser>=6.0.0",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "nltk>=3.9.1",
    "openai>=1.73.0",
    "psycopg2-binary>=2.9.10",
    "requests>=2.32.3",
    "sendgrid>=6.11.0",
    "sqlalchemy>=2.0.40",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
